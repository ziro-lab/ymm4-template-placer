name: native-yymm4-proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**/*.cs', 'src/**/*.csproj', 'src/**/*.xaml', 'tests/**', 'fixtures/**', '.github/workflows/native-yymm4-proof.yml']
  pull_request:
    paths: ['src/**/*.cs', 'src/**/*.csproj', 'src/**/*.xaml', 'tests/**', 'fixtures/**', '.github/workflows/native-yymm4-proof.yml']
permissions:
  contents: read
concurrency:
  group: native-yymm4-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-proof:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm .NET 10 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks | Tee-Object -FilePath dotnet-sdks.txt
          if (-not (Select-String -Path dotnet-sdks.txt -Pattern '^10\.')) { throw '.NET 10 SDK missing' }
      - name: Download exact YMM4 4.55.1.1 Lite
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.55.1.1/YukkuriMovieMaker_v4.55.1.1_Lite.zip
          if ($LASTEXITCODE -ne 0) { throw 'YMM4 download failed' }
          $hash=(Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b') { throw "YMM4 hash mismatch: $hash" }
          Expand-Archive -LiteralPath ymm4.zip -DestinationPath ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YMM4 exe missing' }
          "YMM4_DIR=$($exe.Directory.FullName)\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "YMM4_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build native proof plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          dotnet build src/Ymm4TemplatePlacer/Ymm4TemplatePlacer.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -p:Ymm4Proof=true --nologo 2>&1 | Tee-Object out/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }
          $dll=Get-ChildItem src/Ymm4TemplatePlacer/bin/Release -Recurse -Filter Ymm4TemplatePlacer.dll | Select-Object -First 1
          $dest=Join-Path $env:YMM4_DIR 'user\plugin\Ymm4TemplatePlacer'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $dll.FullName $dest
      - name: Run native YMM4 functional proof
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class CwtWin32 {
            public delegate bool EnumWindowsProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
          }
          '@
          $env:YMM4_TEMPLATE_PLACER_CI_MARKER=Join-Path $PWD 'out\plugin-loaded.txt'
          $env:YMM4_TEMPLATE_PLACER_PROOF_DIR=Join-Path $PWD 'out'
          $result=Join-Path $PWD 'out\proof-result.txt'
          $p=Start-Process $env:YMM4_EXE -WorkingDirectory $env:YMM4_DIR -PassThru
          try {
            for ($i=0; $i -lt 150; $i++) {
              if ((Test-Path $result) -or $p.HasExited) { break }
              $cb=[CwtWin32+EnumWindowsProc]{
                param([IntPtr]$h,[IntPtr]$l)
                [uint32]$windowPid=0
                [void][CwtWin32]::GetWindowThreadProcessId($h,[ref]$windowPid)
                if ($windowPid -eq $p.Id -and [CwtWin32]::IsWindowVisible($h)) {
                  $s=New-Object Text.StringBuilder 1024
                  [void][CwtWin32]::GetWindowText($h,$s,1024)
                  $t=$s.ToString()
                  "$t" | Add-Content out/windows-seen.txt
                  if ($t -like '*Check for updates*' -or $t -like '*About YukkuriMovieMaker*') {
                    [void][CwtWin32]::PostMessage($h,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)
                  } elseif ($t -eq 'Confirm') {
                    [void][CwtWin32]::PostMessage($h,0x0100,[IntPtr]0x0D,[IntPtr]::Zero)
                    [void][CwtWin32]::PostMessage($h,0x0101,[IntPtr]0x0D,[IntPtr]::Zero)
                  }
                }
                return $true
              }
              [void][CwtWin32]::EnumWindows($cb,[IntPtr]::Zero)
              Start-Sleep -Seconds 1
            }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
          if (Test-Path out/api-surface.txt) { Get-Content out/api-surface.txt }
          if (Test-Path out/proof-log.txt) { Get-Content out/proof-log.txt }
          if (-not (Test-Path $result)) { throw 'Native proof did not finish' }
          Get-Content $result
          if (-not (Select-String -Path $result -Pattern '^PASS P1 P2 P3$')) { throw 'Native functional proof failed' }
      - name: Upload native proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-yymm4-proof
          path: |
            out/
            dotnet-sdks.txt
          if-no-files-found: warn
          retention-days: 14
