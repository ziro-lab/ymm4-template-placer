name: native-yymm4-proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**/*.cs', 'src/**/*.csproj', 'src/**/*.xaml', 'tests/**/*.cs', 'tests/**/*.csproj', 'tests/**/*.ps1', 'fixtures/**/*.json', 'fixtures/**/*.ymmp', 'fixtures/**/*.png', 'fixtures/**/*.xlsx', '.github/workflows/native-yymm4-proof.yml']
  pull_request:
    paths: ['src/**/*.cs', 'src/**/*.csproj', 'src/**/*.xaml', 'tests/**/*.cs', 'tests/**/*.csproj', 'tests/**/*.ps1', 'fixtures/**/*.json', 'fixtures/**/*.ymmp', 'fixtures/**/*.png', 'fixtures/**/*.xlsx', '.github/workflows/native-yymm4-proof.yml']
permissions:
  contents: read
concurrency:
  group: native-yymm4-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-proof:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm .NET 10 SDK
        shell: pwsh
        run: |
          dotnet --list-sdks | Tee-Object -FilePath dotnet-sdks.txt
          if (-not (Select-String -Path dotnet-sdks.txt -Pattern '^10\.')) { throw '.NET 10 SDK missing' }
      - name: Download exact YMM4 4.55.1.1 Lite
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --silent --show-error -o ymm4.zip https://github.com/manju-summoner/YukkuriMovieMaker4/releases/download/v4.55.1.1/YukkuriMovieMaker_v4.55.1.1_Lite.zip
          if ($LASTEXITCODE -ne 0) { throw 'YMM4 download failed' }
          $hash=(Get-FileHash ymm4.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '125860147cc33b831fc1a6d6ea996958001c2ead3b0d37f7d900251d5617db9b') { throw "YMM4 hash mismatch: $hash" }
          Expand-Archive -LiteralPath ymm4.zip -DestinationPath ymm4
          $exe=Get-ChildItem ymm4 -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YMM4 exe missing' }
          "YMM4_DIR=$($exe.Directory.FullName)\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build distributable and isolated proof variant
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/package | Out-Null
          dotnet build src/Ymm4TemplatePlacer/Ymm4TemplatePlacer.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -p:Ymm4Proof=false -o out/package --nologo -warnaserror 2>&1 | Tee-Object out/build-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          $proof=Join-Path $env:RUNNER_TEMP 'placer-proof-build'
          dotnet build src/Ymm4TemplatePlacer/Ymm4TemplatePlacer.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" -p:Ymm4Proof=true -o $proof --nologo -warnaserror 2>&1 | Tee-Object out/build-proof.txt
          if ($LASTEXITCODE -ne 0) { throw 'Proof build failed' }
          $dest=Join-Path $env:YMM4_DIR 'user/plugin/Ymm4TemplatePlacer'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$proof/*.dll" $dest
          Copy-Item "$proof/*.deps.json" $dest
      - name: Run P1-P8 in actual native YMM4
        shell: pwsh
        run: |
          ./tests/RunNative.ps1 -Ymm4Dir $env:YMM4_DIR -OutputDir (Join-Path $PWD 'out') -DistributionDir (Join-Path $PWD 'out/package')
      - name: Native release DLL smoke test
        shell: pwsh
        run: |
          $dest=Join-Path $env:YMM4_DIR 'user/plugin/Ymm4TemplatePlacer'
          Remove-Item "$dest/*" -Recurse -Force
          Copy-Item out/package/*.dll $dest
          Copy-Item out/package/*.deps.json $dest
          ./tests/RunNative.ps1 -Ymm4Dir $env:YMM4_DIR -OutputDir (Join-Path $PWD 'out') -ReleaseSmoke
      - name: Package verified distributable
        shell: pwsh
        run: |
          Copy-Item docs/USAGE.md out/package/README.md
          Copy-Item THIRD_PARTY_NOTICES.md out/package/
          Remove-Item out/package/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out/package/* -DestinationPath out/Ymm4TemplatePlacer-v0.3.0.zip
          Move-Item out/Ymm4TemplatePlacer-v0.3.0.zip out/Ymm4TemplatePlacer-v0.3.0.ymme
          Copy-Item out/package/Ymm4TemplatePlacer.dll out/Ymm4TemplatePlacer.dll
          git archive --format=zip -o out/Ymm4TemplatePlacer-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-FileHash out/Ymm4TemplatePlacer* -Algorithm SHA256 | Select-Object @{Name='File';Expression={Split-Path $_.Path -Leaf}},Hash | ConvertTo-Json | Set-Content out/SHA256.json
      - name: Upload native proof and distributable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-yymm4-proof
          path: |
            out/
            dotnet-sdks.txt
          if-no-files-found: warn
          retention-days: 14
